name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to catch breakage from Emacs snapshot or the toolchain.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux has GNU tar, macOS bsdtar: the dump extraction differs.
        os: [ubuntu-latest, macos-latest]
        emacs: ["29.4", "30.2", snapshot]
    env:
      # Fail instead of skipping tests whose requirements are missing.
      CRATES_TEST_STRICT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Check Emacs features and tools
        run: |
          emacs -Q --batch --eval '(unless (and (sqlite-available-p) (treesit-available-p)) (message "Emacs lacks sqlite or tree-sitter support") (kill-emacs 1))'
          sqlite3 --version
          tar --version | head -n 1
          curl --version | head -n 1

      - uses: actions/cache@v6
        with:
          path: .cache
          key: deps-${{ matrix.os }}-emacs-${{ matrix.emacs }}-${{ hashFiles('test/make.el') }}

      - run: make deps
      - run: make compile
      - run: make checkdoc
      - run: make lint
      - run: make test

  melpazoid:
    name: melpazoid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # melpazoid shells out to emacs to parse the recipe.
      - uses: purcell/setup-emacs@master
        with:
          version: "30.2"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install melpazoid
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/riscy/melpazoid.git ~/melpazoid
          pip install ~/melpazoid

      - name: Run melpazoid
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: (crates :fetcher github :repo "Velnbur/crates.el")
          EXIST_OK: false
        run: make -C ~/melpazoid
